<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>📊 Dashboard de Monitoreo</h1>

<!--CARDS -->
<div class="cards">
  <div class="card">
    <h3>Total Requests</h3>
    <p id="total"></p>
  </div>

  <div class="card">
    <h3>Errores</h3>
    <p id="errores"></p>
  </div>

  <div class="card">
    <h3>Latencia Promedio</h3>
    <p id="latencia"></p>
  </div>

  <div class="card">
    <h3>Estado Servidor</h3>
    <p id="status"></p>
  </div>
</div>

<!-- GRÁFICA -->
<h2>Requests por Método</h2>
<canvas id="chart"></canvas>

<!-- TABLA -->
<h2>Últimos Logs</h2>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Método</th>
      <th>Endpoint</th>
      <th>Status</th>
      <th>Tiempo (ms)</th>
      <th>Fecha</th>
    </tr>
  </thead>
  <tbody id="tabla"></tbody>
</table>

<script src="app.js"></script>
</body>
</html>
